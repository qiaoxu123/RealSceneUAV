controller:
  type: pygame
  joystick_index: 0
  mapping:
    yaw_axis: 0
    throttle_axis: 1
    roll_axis: 2
    pitch_axis: 3
    invert_yaw: false
    invert_throttle: true
    invert_roll: false
    invert_pitch: true
    deadzone: 0.06
    # SDL joystick button indices vary by OS/driver.
    # Run: realsceneuav-controller-check --seconds 15
    mark_target_button: 0
    stop_button: 1
    reset_button: 3
    pause_button: 6

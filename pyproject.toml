[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realsceneuav"
version = "0.1.0"
description = "Real-scene data-driven UAV navigation and human trajectory collection platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RealSceneUAV contributors"}]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
controller = ["pygame>=2.5"]
citynav = [
  "opencv-python-headless>=4.8",
  "rasterio>=1.3",
]
px4 = ["pymavlink>=2.4.42"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
realsceneuav-demo = "realsceneuav.cli.demo:main"
realsceneuav-collect = "realsceneuav.cli.collect:main"
realsceneuav-controller-check = "realsceneuav.cli.controller_check:main"
realsceneuav-citynav-validate = "realsceneuav.cli.citynav_validate:main"
realsceneuav-citynav-collect = "realsceneuav.cli.citynav_collect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
